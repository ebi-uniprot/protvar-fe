  <text x="11" y="12" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="bold"><tspan fill="#9FCBAF">P</tspan><tspan fill="#FF9901">V</tspan></text>
</svg>
